global:
  scrape_interval: 2s
  evaluation_interval: 2s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: payment-api
    static_configs:
      - targets: ["payment-api:9001"]
  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:9002"]
