services:

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${GLPI_DB_NAME}
      MYSQL_USER: ${GLPI_DB_USER}
      MYSQL_PASSWORD: ${GLPI_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  glpi:
    image: glpi/glpi:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GLPI_DB_HOST: ${GLPI_DB_HOST}
      GLPI_DB_PORT: ${GLPI_DB_PORT}
      GLPI_DB_NAME: ${GLPI_DB_NAME}
      GLPI_DB_USER: ${GLPI_DB_USER}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - glpi_data:/var/glpi

  pgvector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: incidents
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d incidents"]
      interval: 10s
      timeout: 5s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:latest
    restart: unless-stopped
    ports:
      - "6006:6006"
      - "4317:4317"

  auth-service:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["uvicorn", "services.auth_service:create_app", "--factory", "--host", "0.0.0.0", "--port", "9002"]
    ports:
      - "9002:9002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9002/health')"]
      interval: 5s
      timeout: 2s
      retries: 10

  payment-api:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["uvicorn", "services.payment_api:create_app", "--factory", "--host", "0.0.0.0", "--port", "9001"]
    environment:
      AUTH_SERVICE_URL: http://auth-service:9002
    depends_on:
      auth-service:
        condition: service_healthy
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9001/health')"]
      interval: 5s
      timeout: 2s
      retries: 10

  traffic-gen:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["uvicorn", "services.traffic_gen:create_app", "--factory", "--host", "0.0.0.0", "--port", "9003"]
    environment:
      PAYMENT_API_URL: http://payment-api:9001
    depends_on:
      payment-api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.7.3
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
    depends_on:
      payment-api:
        condition: service_healthy
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

volumes:
  db_data:
  glpi_data:
  pgvector_data:
