apiVersion: v1
kind: Secret
metadata:
  name: {{ include "incident-triage-agent.fullname" . }}
  labels:
    {{- include "incident-triage-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  GLPI_APP_TOKEN: {{ .Values.secrets.glpiAppToken | quote }}
  GLPI_USER_TOKEN: {{ .Values.secrets.glpiUserToken | quote }}
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | quote }}
